<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
    <link href="2416501030.css" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
        </nav>
    </header>

    <main>
        <h2>Etkinlik Güncelle</h2>

        <!-- data-mode="guncelle" eklenmiş form -->
        <form id="etkinlik-formu" data-mode="guncelle" novalidate>
            <div class="form-grup">
                <label for="ad">Etkinlik Adı:</label>
                <input type="text" id="ad" name="ad">
                <span id="ad-hata" class="hata-mesaji"></span>
            </div>

            <div class="form-grup">
                <label for="kategori">Kategori:</label>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Konser">Konser</option>
                    <option value="Panel">Panel</option>
                    <option value="Konferans">Konferans</option>
                    <option value="Sinema">Sinema</option>
                </select>
                <span id="kategori-hata" class="hata-mesaji"></span>
            </div>

            <div class="form-grup">
                <label for="tarih">Tarih:</label>
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-mesaji"></span>
            </div>

            <div class="form-grup">
                <label for="saat">Saat:</label>
                <input type="time" id="saat" name="saat">
                <span id="saat-hata" class="hata-mesaji"></span>
            </div>

            <div class="form-grup">
                <label for="konum">Konum / Yer:</label>
                <input type="text" id="konum" name="konum">
                <span id="konum-hata" class="hata-mesaji"></span>
            </div>

            <div class="form-grup">
                <label for="kapasite">Kapasite:</label>
                <input type="number" id="kapasite" name="kapasite">
                <span id="kapasite-hata" class="hata-mesaji"></span>
            </div>

            <div class="form-grup">
                <label for="aciklama">Açıklama:</label>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                <span id="aciklama-hata" class="hata-mesaji"></span>
            </div>

            <button type="submit">Etkinliği Güncelle</button>
        </form>

        <div id="form-mesaj"></div>
    </main>

    <footer>
        <p>Ramazan Harun Ergene - 2416501030 - <time datetime="2026-10-12">12 Ekim 2026</time></p>
    </footer>

    <script type="module" src="js/event-form.js"></script>
</body>

</html>
